[project]
name = "qsi"
version = "0.1.0"
description = "How weight quantization affects safety behaviour and interpretable features of an LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "transformers>=4.45",
    "datasets",
    "huggingface_hub",
    "numpy",
    "scikit-learn",
    "matplotlib",
]

[dependency-groups]
colab = ["bitsandbytes", "accelerate"]
dev = ["pytest", "jupyter", "nbformat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
